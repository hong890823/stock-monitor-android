// 共享 debug 签名脚本（可整份拷到其他项目复用）。
//
// 用法：把 keystore/ 目录（shared-debug.keystore + 本脚本）拷到目标项目根目录，
// 然后在 app 模块的 build.gradle 里加一行：
//     apply from: rootProject.file('keystore/shared-debug-signing.gradle')
//
// 为什么不用默认签名：debug 默认用 ~/.android/debug.keystore（每台机器各生成一份），
// 两台电脑装同一包名会出现签名不一致，后装的会清掉前装的应用数据。
// 这份 keystore 随项目走，任何电脑构建出的 debug 包签名一致，覆盖安装不丢数据。
//
// 凭据沿用 debug 惯例（storepass/keypass = android，alias = androiddebugkey），
// 仅供开发调试，不要拿它签 release。

android {
    signingConfigs {
        sharedDebug {
            storeFile rootProject.file('keystore/shared-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sharedDebug
        }
    }
}
